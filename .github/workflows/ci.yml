name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ClinicBook.slnx

      - name: Build
        run: dotnet build ClinicBook.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ClinicBook.slnx --no-build --configuration Release --verbosity normal
